<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      *{
        margin: 0;
        padding: 0;
      }
      body,html{
        width: 100%;
        height: 100%;
      }
      header{
        width: 100%;
        height: 80px;
        display: flex;
        align-items: center;
        gap: 1rem;
        background-color: rgb(199, 42, 42);
      }
      header h2{
        padding-left: 1.4rem;
        font-size: 1.2rem;
      }
      nav a{
        padding: 1rem;
        font-size:1.2rem;
        text-decoration: none;
        color: Black;
        font-weight: 400;
      }
      nav a:hover{
        background-color: whitesmoke;
      }
    </style>
  </head>
  <body>
    <header>
      <h2>Navbar</h2>
      <nav>
        <a href="">Link 1</a>
        <a href="">Link 2</a>
        <a href="">Link 3</a>
        <a href="">Link 4</a>
      </nav>
    </header>
  </body>
</html>
